---
name: Browser E2E DNS debug (temporary)

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dokku-source-dns-debug
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOKKU_SOURCE_REVISION: ${{ github.sha }}
      DOKKU_E2E_IMAGE: dokku-e2e/source:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Select diagnostic directory and default Docker builder
        run: |
          printf 'E2E_ARTIFACTS=%s/dokku-dns-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          docker buildx use default
      - name: Diagnose runner and build namespaces
        run: |
          mkdir -p "$E2E_ARTIFACTS/diagnostics"
          bash tests/E2E/scripts/diagnose-dns.sh 2>&1 | tee "$E2E_ARTIFACTS/diagnostics/dns-before.log"
      - name: Build checked-out Dokku source without external caching
        run: |
          bash tests/E2E/scripts/build-dokku.sh "$E2E_ARTIFACTS"
          docker tag "dokku-e2e/source:${DOKKU_SOURCE_REVISION:0:9}" "$DOKKU_E2E_IMAGE"
      - name: Install isolated source-built Dokku
        run: bash tests/E2E/scripts/install-dokku.sh install
      - name: Repeat DNS checks inside Dokku and its nested Docker daemon
        if: always()
        run: |
          mkdir -p "$E2E_ARTIFACTS/diagnostics"
          if docker compose -f tests/E2E/compose.yml ps --status running --services | grep -qx dokku; then
            docker compose -f tests/E2E/compose.yml exec -T dokku bash -lc 'cat /var/lib/dokku/GIT_REV; cat /etc/resolv.conf; getent ahostsv4 github.com; getent ahostsv4 archive.ubuntu.com; docker version; docker buildx version; docker run --rm alpine nslookup github.com' 2>&1 | tee "$E2E_ARTIFACTS/diagnostics/dns-dokku.log"
          else
            printf 'BLOCKED: source-built Dokku did not start; see source-build log.\n' | tee "$E2E_ARTIFACTS/diagnostics/dns-dokku.log"
          fi
      - name: Stop isolated diagnostic deployment
        if: always()
        run: docker compose -f tests/E2E/compose.yml down --remove-orphans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: dokku-dns-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.E2E_ARTIFACTS }}/diagnostics/*.log
            ${{ env.E2E_ARTIFACTS }}/evidence/*.log
            ${{ env.E2E_ARTIFACTS }}/evidence/*.json
          retention-days: 7
