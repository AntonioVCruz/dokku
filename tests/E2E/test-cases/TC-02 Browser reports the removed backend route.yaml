customSteps: |
  // Controller first proves TC-01 on the healthy route, then removes /api/v0.
  // The web page and script must still be available; only backend routing changes.
  check that page contains "Backend not checked"
  check that page doesn't contain stored value from "expectedBackendMarker"
  click button "Check backend"
  check that page contains "Backend check failed: Backend HTTP 404"
  check that page doesn't contain stored value from "expectedBackendMarker"
  check that page doesn't contain "Backend not checked"
labels:
  - dokku-route-removed
  - proxy-routing
